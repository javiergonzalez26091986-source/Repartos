name: Despertador Repartos

on:
  schedule:
    # Se ejecuta en el minuto 0 de cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  despertar:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencia de red (Requests)
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecutar el script despertador
      run: python despertar.py
